<script>
document.addEventListener("DOMContentLoaded", function () {
MoliInit("home");
var M = window.MOLI, C = M.content;
function catOf(it) { for (var i = 0; i < M.menu.length; i++) if (M.menu[i].items.indexOf(it) >= 0) return M.menu[i]; }
function all() { var r = []; M.menu.forEach(function (c) { c.items.forEach(function (i) { r.push(i); }); }); return r; }
function pick(tag, fallbackImgs) {
  var list = all().filter(function (i) { return i.home === tag; });
  if (!list.length) list = all().filter(function (i) { return fallbackImgs.some(function (f) { return i.img.indexOf(f) >= 0; }); });
  return list.map(function (i) { return MoliDish(i, MoliName(catOf(i))); }).join("");
}
document.getElementById("specials").innerHTML = pick("special", ["pizza-zatar-cheese", "napo-grilled-beef", "gelato-pistachio"]);
document.getElementById("more").innerHTML = pick("more", ["pizza-four-cheese", "pizza-smoked-salmon", "burger-beef", "sub-grilled-chicken", "special-bechamel", "salad-salmon"]);
document.getElementById("hours").innerHTML = MoliHours().map(function (d) {
  return '<tr class="' + (d.closed ? "off" : "") + '"><td>' + esc(d.name) + "</td><td>" + esc(d.text) + "</td></tr>";
}).join("");
var addr = L4(M.site.address);
document.getElementById("addr").innerHTML = (addr ? "📍 " + esc(addr) : "") + (M.site.phone ? "<br>☎ " + esc(M.site.phone) : "");
if (C) {
  // banners
  var bs = (C.banners || []).filter(function (b) { return b.show !== false && b.img; });
  if (bs.length) document.getElementById("slides").innerHTML = bs.map(function (b, k) {
    var set = (b.img_m ? esc(b.img_m) + " 900w, " : "") + esc(b.img) + " 1600w";
    return '<a href="' + esc(b.link || "#") + '"><img ' + (k === 0 ? 'src="' + esc(b.img) + '" srcset="' + set + '"' : 'data-srcset="' + set + '"') +
      ' sizes="100vw" alt="' + esc(b.alt || "") + '"></a>';
  }).join("");
  // highlight boxes
  var ads = (C.ads || []).filter(function (a) { return a.show !== false; });
  document.getElementById("ads").innerHTML = ads.map(function (a) {
    return '<a class="ad" href="' + esc(a.link || "menu.html") + '"><img loading="lazy" src="' + esc(a.img) + '" alt="">' +
      '<div class="ad-in"><span class="ad-badge" style="background:' + esc(a.color || "#d7263d") + '">' + esc(L4(a.badge)) + "</span>" +
      "<h3>" + esc(L4(a.title)) + "</h3><p>" + esc(L4(a.sub)) + "</p>" +
      '<div class="ad-foot"><b>' + esc(L4(a.price)) + "</b><span>" + esc(L4(a.cta)) + "</span></div></div></a>";
  }).join("");
  if (!ads.length) document.querySelector(".ads").style.display = "none";
  // photo feature blocks
  document.getElementById("features").innerHTML = (C.features || []).filter(function (f) { return f.show !== false; }).map(function (f, k) {
    return '<div class="feature' + (k % 2 ? " rev" : "") + '"><div class="ph"><img loading="lazy" src="' + esc(f.img) + '" alt=""></div>' +
      '<div class="box"><div class="inner"><div class="icn">' + esc(f.icon || "") + "</div><h3>" + esc(L4(f.title)) +
      '</h3><div class="title" style="margin:0"><div class="div"></div></div><p>' + esc(L4(f.text)) + "</p></div></div></div>";
  }).join("");
  // QR code
  if (C.images && C.images.qr) document.getElementById("qr").innerHTML = '<div><img src="' + esc(C.images.qr) + '" alt="QR" style="max-width:220px;margin:0 auto 10px"><b>' +
    esc(MoliText("scan_to_order_on_wechat", "微信扫码点餐", "Scan to order on WeChat")) + "</b></div>";
}
(function () {
  var s = document.getElementById("slides"), n = s.children.length, i = 0, d = document.getElementById("dots"), timer;
  for (var k = 0; k < n; k++) { var b = document.createElement("button"); b.setAttribute("aria-label", "Slide " + (k + 1)); (function (k) { b.onclick = function () { go(k); }; })(k); d.appendChild(b); }
  function go(k) { if (!n) return; i = (k + n) % n; s.style.transform = "translateX(" + (-100 * i) + "%)";
    for (var j = 0; j < n; j++) d.children[j].className = j === i ? "on" : "";
    clearInterval(timer); timer = setInterval(function () { go(i + 1); }, 5000); }
  document.getElementById("prev").onclick = function () { go(i - 1); };
  document.getElementById("next").onclick = function () { go(i + 1); };
  var x0 = null; s.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  s.addEventListener("touchend", function (e) { if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1)); x0 = null; });
  go(0);
  function rest() { var im = s.querySelectorAll("img[data-srcset]"); for (var q = 0; q < im.length; q++) { im[q].srcset = im[q].getAttribute("data-srcset"); im[q].removeAttribute("data-srcset"); } }
  if (document.readyState === "complete") setTimeout(rest, 300); else window.addEventListener("load", function () { setTimeout(rest, 300); });
})();
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
MoliInit("home");
var L = MoliLang();
function find(img) { for (var i = 0; i < MENU.length; i++) for (var j = 0; j < MENU[i].items.length; j++) if (MENU[i].items[j].img === img) return [MENU[i].items[j], MENU[i]]; }
function render(id, list) {
  document.getElementById(id).innerHTML = list.map(function (img) { var f = find(img); return MoliDish(f[0], MoliName(f[1])); }).join("");
}
render("specials", ["pizza-zatar-cheese", "napo-grilled-beef", "gelato-pistachio"]);
render("more", ["pizza-four-cheese", "pizza-smoked-salmon", "burger-beef", "sub-grilled-chicken", "special-bechamel", "salad-salmon"]);
document.getElementById("hours").innerHTML = SITE.hours.map(function (d) {
  return '<tr class="' + (d[2] === null ? "off" : "") + '"><td>' + T(d[0], d[1]) + "</td><td>" +
    (d[2] === null ? T("休息", "Closed") : (d[2] || T("营业", "Open"))) + "</td></tr>";
}).join("");
document.getElementById("addr").innerHTML = (SITE.address_zh ? "📍 " + T(SITE.address_zh, SITE.address_en || SITE.address_zh) : "") + (SITE.phone ? "<br>☎ " + SITE.phone : "");
(function () {
  var s = document.getElementById("slides"), n = s.children.length, i = 0, d = document.getElementById("dots"), timer;
  for (var k = 0; k < n; k++) { var b = document.createElement("button"); b.setAttribute("aria-label", "Slide " + (k + 1)); (function (k) { b.onclick = function () { go(k); }; })(k); d.appendChild(b); }
  function go(k) { i = (k + n) % n; s.style.transform = "translateX(" + (-100 * i) + "%)";
    for (var j = 0; j < n; j++) d.children[j].className = j === i ? "on" : "";
    clearInterval(timer); timer = setInterval(function () { go(i + 1); }, 5000); }
  document.getElementById("prev").onclick = function () { go(i - 1); };
  document.getElementById("next").onclick = function () { go(i + 1); };
  var x0 = null; s.addEventListener("touchstart", function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  s.addEventListener("touchend", function (e) { if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; if (Math.abs(dx) > 40) go(i + (dx < 0 ? 1 : -1)); x0 = null; });
  go(0);
  function rest() { var im = s.querySelectorAll("img[data-srcset]"); for (var q = 0; q < im.length; q++) { im[q].srcset = im[q].getAttribute("data-srcset"); im[q].removeAttribute("data-srcset"); } }
  if (document.readyState === "complete") setTimeout(rest, 300); else window.addEventListener("load", function () { setTimeout(rest, 300); });
})();
});
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu 菜单 · Moli Taste 茉莉品味</title>
<meta name="description" content="Moli Taste full menu: Neapolitan pizza, Moli specials, burgers, sandwiches, coffee, drinks, gelato, salads and snacks.">
<link rel="stylesheet" href="style.css">
<script src="site.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<div class="intro"><div class="in" style="padding:56px 20px 50px">
  <div class="big">Our Menu</div><div class="tag">茉莉品味 · 完整菜单</div><hr>
  <p data-zh="「起」表示起步价，规格不同价格不同。下单请使用微信小程序「茉莉品味」。周日休息。"
     data-en="“+” marks a starting price (sizes vary). Order on the WeChat mini program “茉莉品味”. Closed on Sundays."></p>
</div></div>
<div class="tabs"><div class="wrap" id="tabs"></div></div>
<main id="menu"></main>
<div id="site-footer"></div>
<script>
document.addEventListener("DOMContentLoaded", function () {
MoliInit("menu");
var L = MoliLang();
var SCRIPT = { pizza: "Pizzeria", specials: "Specials", burger: "Burgers", sandwich: "Fresh baked", coffee: "Coffee", drinks: "Drinks", gelato: "Daily fresh", salad: "Garden", snacks: "Snacks" };
document.getElementById("tabs").innerHTML = MENU.map(function (c) {
  return '<a href="#' + c.id + '" data-id="' + c.id + '">' + MoliName(c) + "</a>";
}).join("");
document.getElementById("menu").innerHTML = MENU.map(function (c, k) {
  return '<section class="mcat' + (k % 2 ? " pattern" : "") + '" id="' + c.id + '"><div class="wrap">' +
    '<div class="title"><div class="scr">' + SCRIPT[c.id] + "</div><h2>" + MoliName(c) + " · " + (L === "zh" ? c.en : c.zh) +
    '</h2><div class="div"></div></div><div class="dishes">' +
    c.items.map(function (it) { return MoliDish(it, MoliName(c)); }).join("") + "</div></div></section>";
}).join("");
var tabs = document.querySelectorAll("#tabs a");
function mark() {
  var cur = MENU[0].id;
  if (window.scrollY < 80) { for (var i = 0; i < tabs.length; i++) tabs[i].className = i === 0 ? "on" : ""; return; }
  MENU.forEach(function (c) { if (document.getElementById(c.id).getBoundingClientRect().top < 180) cur = c.id; });
  for (var i = 0; i < tabs.length; i++) tabs[i].className = tabs[i].getAttribute("data-id") === cur ? "on" : "";
}
window.addEventListener("scroll", mark, { passive: true }); mark();
});
</script>
</body>
</html>
